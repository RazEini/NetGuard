server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: network_guardian
    static_configs:
      - targets:
          - localhost
        labels:
          job: network_guardian
          __path__: /var/log/app/*.json

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event_type: event_type
            src_ip: src_ip
            details: details
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          event_type:
          src_ip:
